<html lang="es">
<head>

<meta charset="UTF-8">

<title>Correo</title>

<style>

/* =====================================================
   GENERAL
===================================================== */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:-apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Arial,
                sans-serif;
}

body{
    background:#fff;
    color:#202124;
    overflow:hidden;
}


/* =====================================================
   LOGIN
===================================================== */

#login{
    position:fixed;
    inset:0;
    background:#f6f7fb;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:9999;
}

.login-box{
    width:100%;
    max-width:380px;
    background:white;
    padding:32px 26px;
    border-radius:15px;
    box-shadow:0 8px 35px rgba(0,0,0,.12);
}

.login-logo{
    font-size:31px;
    font-weight:600;
    color:#1a73e8;
    margin-bottom:6px;
}

.login-subtitle{
    color:#777;
    font-size:12px;
    margin-bottom:26px;
}

.login-box h1{
    font-size:22px;
    font-weight:500;
    margin-bottom:7px;
}

.login-box p{
    color:#666;
    font-size:13px;
    margin-bottom:22px;
}

.login-box input{
    width:100%;
    height:47px;
    border:1px solid #ccc;
    border-radius:6px;
    padding:0 13px;
    font-size:14px;
    margin-bottom:11px;
    outline:none;
}

.login-box input:focus{
    border:2px solid #1a73e8;
}

.login-button{
    width:100%;
    height:46px;
    border:none;
    border-radius:6px;
    background:#1a73e8;
    color:white;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
}

.login-note{
    margin-top:15px;
    font-size:10px;
    line-height:1.5;
    color:#888;
}


/* =====================================================
   APP
===================================================== */

#app{
    display:none;
    height:100vh;
}


/* =====================================================
   BARRA SUPERIOR
===================================================== */

.top{
    height:68px;
    border-bottom:1px solid #ddd;
    display:flex;
    align-items:center;
    padding:0 16px;
    position:relative;
    background:#fff;
}


/* BOTÓN MENÚ */

.menu{
    width:40px;
    height:40px;
    border:none;
    background:none;
    font-size:25px;
    color:#555;
    cursor:pointer;
    z-index:5;
}


/* =====================================================
   LOGO CENTRADO
===================================================== */

.logo-center{
    position:absolute;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    width:210px;
    height:48px;

    display:flex;
    align-items:center;
    justify-content:center;

    z-index:2;
}

.logo-center img{
    width:100%;
    height:100%;

    object-fit:contain;

    display:block;
}


/* BOTÓN REDACTAR */

.compose-top{
    width:43px;
    height:43px;

    border:none;
    border-radius:7px;

    background:#e94335;
    color:white;

    font-size:24px;

    cursor:pointer;

    margin-left:auto;

    z-index:5;
}


/* =====================================================
   BUSCADOR
===================================================== */

.search{
    height:62px;

    border-bottom:1px solid #ddd;

    display:flex;
    align-items:center;

    padding:0 18px;
}

.search-icon{
    font-size:28px;
    color:#666;
    margin-right:13px;
}

.search input{
    width:100%;

    border:none;
    outline:none;

    font-size:21px;

    color:#222;
}

.search input::placeholder{
    color:#aaa;
}


/* =====================================================
   BANDEJA
===================================================== */

.inbox{
    height:calc(100vh - 130px);

    overflow-y:auto;

    background:#fff;
}

.email{
    min-height:102px;

    border-bottom:1px solid #e2e2e2;

    padding:12px 15px;

    cursor:pointer;

    display:grid;

    grid-template-columns:
        25px
        1fr
        auto;

    grid-template-rows:
        auto
        auto
        auto;

    column-gap:9px;
}

.email:hover{
    background:#fafafa;
}

.email-check{
    width:21px;
    height:21px;

    grid-row:1 / 4;

    margin-top:17px;
}

.email-main{
    min-width:0;
}

.sender{
    font-size:18px;
    font-weight:600;

    line-height:1.15;

    margin-bottom:4px;
}

.subject{
    font-size:16px;

    line-height:1.25;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}

.preview{
    color:#888;

    font-size:14px;

    line-height:1.25;

    margin-top:3px;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}

.date{
    font-size:13px;

    color:#1769d2;

    white-space:nowrap;

    padding-top:2px;

    text-align:right;
}

.star{
    font-size:25px;

    color:#ccc;

    grid-column:3;

    text-align:right;

    align-self:end;

    cursor:pointer;

    line-height:23px;
}

.star.active{
    color:#f5b400;
}


/* =====================================================
   MENSAJE ABIERTO
===================================================== */

#message{
    display:none;

    position:absolute;

    top:130px;
    left:0;
    right:0;
    bottom:0;

    background:white;

    overflow-y:auto;

    z-index:20;
}

.message-top{
    height:57px;

    border-bottom:1px solid #ddd;

    display:flex;

    align-items:center;

    padding:0 17px;
}

.back{
    border:none;
    background:none;

    font-size:28px;

    color:#555;

    cursor:pointer;

    margin-right:16px;
}

.message-title{
    font-size:19px;

    font-weight:500;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}

.message-content{
    padding:25px 24px;
    max-width:850px;
}

.message-sender{
    font-size:19px;

    font-weight:600;

    margin-bottom:5px;
}

.message-address{
    color:#777;

    font-size:13px;

    line-height:1.5;

    margin-bottom:27px;
}

.message-body{
    font-size:16px;

    line-height:1.7;

    white-space:pre-line;
}

.message-date{
    color:#777;

    font-size:12px;

    margin-top:10px;
}


/* =====================================================
   MENÚ LATERAL
===================================================== */

#sideMenu{
    display:none;

    position:fixed;

    top:0;
    bottom:0;
    left:0;

    width:280px;

    background:white;

    z-index:4000;

    box-shadow:5px 0 25px rgba(0,0,0,.20);
}

.side-title{
    height:68px;

    border-bottom:1px solid #ddd;

    display:flex;

    align-items:center;

    padding:0 17px;

    font-size:21px;

    color:#555;
}

.side-title .menu{
    margin-right:8px;
}

.side-section{
    padding:14px 20px 7px;

    color:#999;

    font-size:11px;

    text-transform:uppercase;

    letter-spacing:.5px;
}

.side-item{
    padding:14px 23px;

    font-size:15px;

    cursor:pointer;

    border-bottom:1px solid #f0f0f0;

    display:flex;

    justify-content:space-between;

    align-items:center;
}

.side-item:hover{
    background:#f5f5f5;
}

.side-number{
    color:#888;
    font-size:12px;
}


/* =====================================================
   REDACTAR
===================================================== */

#compose{
    display:none;

    position:fixed;

    right:22px;
    bottom:0;

    width:450px;

    background:white;

    border-radius:9px 9px 0 0;

    box-shadow:0 0 30px rgba(0,0,0,.25);

    z-index:5000;
}

.compose-header{
    height:46px;

    background:#f1f3f4;

    padding:0 14px;

    display:flex;

    align-items:center;

    justify-content:space-between;
}

.compose-header button{
    border:none;

    background:none;

    font-size:21px;

    cursor:pointer;
}

.compose-body{
    padding:9px 14px 16px;
}

.compose-body input{
    width:100%;

    height:40px;

    border:none;

    border-bottom:1px solid #ddd;

    outline:none;

    font-size:13px;
}

.compose-body textarea{
    width:100%;

    height:205px;

    border:none;

    resize:none;

    outline:none;

    padding-top:13px;

    font-size:14px;
}

.send{
    border:none;

    background:#1a73e8;

    color:white;

    padding:9px 21px;

    border-radius:20px;

    cursor:pointer;

    font-size:13px;

/* =====================================================

===================================================== */

@media(max-width:600px){

    }

    .message-title{
        font-size:17px;
    }

    .message-body{
        font-size:15px;
    }

let currentFolder="inbox";


/* =====================================================
   LOGIN
===================================================== */

function login(){

    document.getElementById("login").style.display="none";

    document.getElementById("app").style.display="block";

    render();

}


/* =====================================================
   RENDER
===================================================== */

function render(){

    const inbox=
        document.getElementById("inbox");

    inbox.innerHTML="";


    let search=
        document.getElementById("search")
        .value
        .toLowerCase()
        .trim();


    let filtered;


    if(currentFolder==="starred"){

        filtered=emails.filter(mail=>mail.star);

    }

    else{

        filtered=emails.filter(
            mail=>mail.folder===currentFolder
        );

    }


    if(search){

        filtered=filtered.filter(mail=>{

            return (

                mail.sender
                    .toLowerCase()
                    .includes(search)

                ||

                mail.subject
                    .toLowerCase()
                    .includes(search)

                ||

                mail.preview
                    .toLowerCase()
                    .includes(search)

                ||

                mail.address
                    .toLowerCase()
                    .includes(search)

            );

        });

    }


    document.getElementById("inboxCount")
        .textContent =
        emails.filter(
            mail=>mail.folder==="inbox"
        ).length;


    document.getElementById("sentCount")
        .textContent =
        emails.filter(
            mail=>mail.folder==="sent"
        ).length;


    filtered.forEach(mail=>{

        const item=
            document.createElement("div");


        item.className="email";


        item.innerHTML=`

            <input
                class="email-check"
                type="checkbox"
                onclick="event.stopPropagation()"
            >


            <div class="email-main">

                <div class="sender">
                    ${mail.sender}
                </div>

                <div class="subject">
                    ${mail.subject}
                </div>

                <div class="preview">
                    ${mail.preview}
                </div>

            </div>


            <div>

                <div class="date">
                    ${mail.date}
                </div>


                <div
                    class="star ${mail.star ? "active":""}"
                    onclick="
                        toggleStar(
                            event,
                            ${mail.id}
                        )
                    ">

                    ${mail.star ? "★":"☆"}

                </div>

            </div>

        `;


        item.onclick=function(){

            openMessage(mail.id);

        };


        inbox.appendChild(item);

    });

}


/* =====================================================
   ABRIR MENSAJE
===================================================== */

function openMessage(id){

    const mail=
        emails.find(
            x=>x.id===id
        );


    if(!mail)return;


    mail.unread=false;


    document.getElementById("inbox")
        .style.display="none";


    document.getElementById("message")
        .style.display="block";


    document.getElementById("messageTitle")
        .textContent=
        mail.subject;


    document.getElementById("messageSender")
        .textContent=
        mail.sender;


    document.getElementById("messageAddress")
        .textContent=
        "Para: " +
        mail.address;


    document.getElementById("messageBody")
        .textContent=
        mail.body;


    document.getElementById("messageDate")
        .textContent=
        mail.fullDate
            ? mail.fullDate
            : mail.date;

}


/* =====================================================
   CERRAR MENSAJE
===================================================== */

function closeMessage(){

    document.getElementById("message")
        .style.display="none";


    document.getElementById("inbox")
        .style.display="block";


    render();

}


/* =====================================================
   ESTRELLA
===================================================== */

function toggleStar(event,id){

    event.stopPropagation();


    const mail=
        emails.find(
            x=>x.id===id
        );


    if(!mail)return;


    mail.star=!mail.star;


    render();

}

===================================================== */

        .value="";

}


function closeCompose(){

    document.getElementById("compose")

/* =====================================================
   ENVIAR
===================================================== */

function sendEmail(){

    const to=
        document.getElementById("to")
        .value
        .trim();


    const subject=
        document.getElementById("subject")
        .value
        .trim();


    const body=
        document.getElementById("body")
        .value
        .trim();


    if(!to || !subject || !body){

        alert(
            "Completa todos los campos."
        );

        return;

    }


    const now=
        new Date();


    const dateText=
        now.toLocaleDateString(
            "es-ES",
            {
                day:"numeric",
                month:"short"
            }
        )
        +
        ", "
        +
        now.toLocaleTimeString(
            "es-ES",
            {
                hour:"2-digit",
                minute:"2-digit"
            }
        );


    const fullDate=
        now.toLocaleDateString(
            "es-ES",
            {
                weekday:"long",
                day:"numeric",
                month:"long",
                year:"numeric"
            }
        )
        +
        ", "
        +
        now.toLocaleTimeString(
            "es-ES",
            {
                hour:"2-digit",
                minute:"2-digit"
            }
        );


    emails.unshift({

        id:Date.now(),

        sender:"Emiliano Chuva",

        subject:subject,

        preview:
            body.substring(0,90),

        date:dateText,

        fullDate:fullDate,

        address:to,

        body:body,

        unread:false,

        star:false,

        folder:"sent"

    });


    document.getElementById("subject")
        .value="";


    document.getElementById("body")
        .value="";


    closeCompose();


    currentFolder="sent";


    render();

}
